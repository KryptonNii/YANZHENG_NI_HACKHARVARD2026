name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, engine, api, validation, science]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check package exists
        id: present
        run: |
          if [ -f "${{ matrix.package }}/pyproject.toml" ]; then echo "yes=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::${{ matrix.package }}/ not present, skipped"; fi
      - name: Install
        if: steps.present.outputs.yes
        working-directory: ${{ matrix.package }}
        run: uv sync
      - name: Ruff
        if: steps.present.outputs.yes
        working-directory: ${{ matrix.package }}
        run: uv run --with ruff ruff check .
      - name: Mypy (strict)
        if: steps.present.outputs.yes && (matrix.package == 'engine' || matrix.package == 'contracts')
        working-directory: ${{ matrix.package }}
        run: |
          pkg=$([ "${{ matrix.package }}" = engine ] && echo trialpilot_engine || echo "trialpilot_contracts gen.py")
          uv run --with mypy mypy --strict $pkg
      - name: Generated contracts are up to date
        if: steps.present.outputs.yes && matrix.package == 'contracts'
        run: uv run --project contracts python contracts/gen.py --check
      - name: Pytest
        if: steps.present.outputs.yes
        working-directory: ${{ matrix.package }}
        env:
          DEMO_OFFLINE: "1"
        run: |
          if [ ! -d tests ]; then echo "::notice::no tests/ yet"; exit 0; fi
          rc=0; uv run pytest || rc=$?
          if [ $rc -eq 5 ]; then echo "::notice::no tests collected"; exit 0; fi
          exit $rc

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check web exists
        id: present
        run: |
          if [ -f web/package.json ]; then echo "yes=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::web/ not present, skipped"; fi
      - uses: pnpm/action-setup@v4
        if: steps.present.outputs.yes
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.present.outputs.yes
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        if: steps.present.outputs.yes
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck
        if: steps.present.outputs.yes
        run: pnpm --dir web typecheck
      - name: Vitest
        if: steps.present.outputs.yes
        run: pnpm --dir web test
