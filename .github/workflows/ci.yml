name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [contracts, engine, api, validation, science]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ matrix.package }}
        run: uv sync
      - name: Ruff
        working-directory: ${{ matrix.package }}
        run: uv run ruff check .
      - name: Mypy (strict)
        if: matrix.package == 'engine' || matrix.package == 'contracts'
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = engine ]; then
            uv run mypy --strict trialpilot_engine
          else
            uv run mypy --strict trialpilot_contracts gen.py
          fi
      - name: Generated contracts are up to date
        if: matrix.package == 'contracts'
        run: uv run --project contracts python contracts/gen.py --check
      - name: Pytest
        working-directory: ${{ matrix.package }}
        env:
          DEMO_OFFLINE: "1"
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir web typecheck
      - name: Vitest
        run: pnpm --dir web test
