# TrialPilot, local only:  docker compose up --build
# Then open http://127.0.0.1:8000 . That address is the compose port bind, not a deployed URL.
# Docker was not installed in the integration environment, so this file has not been executed.
# One image (api/Dockerfile) serves FastAPI under /api and the built web app at /.
# The image command is the Dockerfile CMD: python -m trialpilot_api.seed, then
# uvicorn trialpilot_api.main:app . `make dev` uses the equivalent factory create_app.
# Ports are bound to 127.0.0.1 only. Runs offline by default. Set DEMO_OFFLINE=0 in .env for live imports.
name: trialpilot

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: trialpilot:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_OFFLINE: ${DEMO_OFFLINE:-1}
      TP_DATA_DIR: /data
    volumes:
      - tp-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  tp-data:
