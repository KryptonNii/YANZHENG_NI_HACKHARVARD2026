# PRIMETIME carbon footprint — line-by-line transcription of the published calculation.
#
# Source: Griffiths J, Fox L, Williamson PR, on behalf of the Low Carbon Clinical Trials Group.
#   "Quantifying the carbon footprint of clinical trials: guidance development and case studies."
#   BMJ Open 2024;14:e075755. doi:10.1136/bmjopen-2023-075755 (CC BY 4.0).
#   Online supplemental appendix D ("PRIMETIME carbon footprint calculations", worksheet V0.2 14 Feb 2023),
#   file bmjopen-2023-075755supp004.pdf, retrieved via Europe PMC (PMC10823997) on 2026-10-16.
#   The PDF is image-only; every number below was transcribed by hand from the page images (page = PDF page).
#
# Format: see casps_ledger.yaml.
trial:
  id: primetime
  name: PRIMETIME
  registry_id: ISRCTN41579286
  title: "PRIMETIME: postoperative avoidance of radiotherapy (biomarker-selected very-low-risk breast cancer)"
  phase: "Phase 3"
  patients: 1962
  sites: 64
  countries: [GB]
  duration_years: 10
  drug_type: none
  description: >-
    UK cohort trial of omitting radiotherapy; electronic data capture, NHS data linkage, shipment of tissue samples
    for immunohistochemistry and long-term sample storage (appendix D p.3). 67 sites set up, 64 recruited.

published:
  # Appendix D p.23-24 "PRIMETIME carbon footprint summary" (kg CO2e).
  total_kg: 89360.2
  total_main_text_kg: 89360        # main text, Results: "89 tonnes (89 360 kgCO2e)"
  modules:
    setup: 454.2
    trial_management: 11733.3
    meetings_travel: 1136.2
    intervention: 0
    data_collection: 7572.1
    supplies_equipment: 1741.5
    patient_assessments: 60822.7
    samples: 438.2
    laboratory: 2061.4
    closeout: 3400.6
  figure_modules:                  # Figure 3 labels (rounded), main article; intervention not shown
    setup: 454
    trial_management: 11733
    meetings_travel: 1136
    data_collection: 7572
    supplies_equipment: 1742
    patient_assessments: 60823
    samples: 438
    laboratory: 2061
    closeout: 3401

findings:
  - id: primetime-f1
    severity: medium
    lines: [mt-hotels]
    summary: "Hotel stays: '8 x 13.9 = 250.2 kgCO2e'; 8 x 13.9 = 111.2 (250.2 = 18 x 13.9)."
    detail: >-
      Appendix D p.8-9 states 8 rooms (one person, one night) and 'Assumption: 8 stays (for TMG meetings)' twice, but
      prints 250.2 kg. Recomputing from the stated activity gives 111.2 kg (-139.0 kg, -12.2% of the meetings module,
      -0.16% of the total). The corrected variant uses 8 room-nights.
  - id: primetime-f2
    severity: info
    lines: [smp-kits-to-sites]
    summary: "Sample kits to sites: calculation text '630 x 295.88' but the printed t.km (100.77) matches the stated 301.8 km average."
  - id: primetime-f3
    severity: info
    lines: [smp-tracking-paper]
    summary: "Tracking slips: text '26.9 kg x 0.919' but the result 27.5 matches 29.89 kg (5978 pages x 5 g)."
  - id: primetime-f4
    severity: info
    lines: [pa-scans]
    summary: "Mammograms are costed with the chest X-ray factor (0.8 kg/scan) — the guidance lists no mammography factor."

