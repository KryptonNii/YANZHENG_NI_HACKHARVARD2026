# CASPS carbon footprint — line-by-line transcription of the published calculation.
#
# Source: Griffiths J, Fox L, Williamson PR, on behalf of the Low Carbon Clinical Trials Group.
#   "Quantifying the carbon footprint of clinical trials: guidance development and case studies."
#   BMJ Open 2024;14:e075755. doi:10.1136/bmjopen-2023-075755 (CC BY 4.0).
#   Online supplemental appendix C ("CASPS carbon footprint calculations", worksheet V0.2 14 Feb 2023),
#   file bmjopen-2023-075755supp003.pdf, retrieved via Europe PMC (PMC10823997) on 2026-10-16.
#   The PDF is image-only; every number below was transcribed by hand from the page images (page = PDF page).
#
# Each line: kg CO2e = product(qty) / qty_div × factor. `reported_kg` is the value printed in the appendix.
# `factor_key` links the paper's factor to data/params ids via science/data/factor_map.yaml (library check).
# `correction` = what TrialPilot changes in the "corrected" variant, with the finding id (see `findings`).
trial:
  id: casps
  name: CASPS
  registry_id: ISRCTN63733470
  title: "Cediranib in patients with alveolar soft-part sarcoma (CASPS)"
  phase: "Phase 2"
  patients: 47
  sites: 12
  countries: [GB, ES, AU]
  duration_years: 6
  drug_type: small_molecule
  description: >-
    International phase II trial of cediranib (oral IMP shipped internationally), paper CRFs, on-site visits for
    initiation, monitoring and audit, trial-specific hospital visits and sample provision (appendix C p.3).

published:
  # Appendix C p.24 "CASPS carbon footprint summary" (kg CO2e).
  total_kg: 71938.8
  total_main_text_kg: 71939        # main text, Results: "72 tonnes (71 939 kgCO2e)"
  modules:
    setup: 349.8
    trial_management: 23487.6      # "CTU emissions"
    meetings_travel: 20465.3       # "Trial staff meetings and travel"
    intervention: 1251.5           # "Treatment intervention" (IMP distribution + overage destruction, not manufacture)
    data_collection: 558.3
    supplies_equipment: 522.5
    patient_assessments: 11298.4
    samples: 1930.5
    laboratory: 9353.6
    closeout: 2721.3               # "Analysis and trial close out" (Figure 2 label: "Archiving")
  figure_modules:                  # Figure 2 labels (rounded), main article
    setup: 350
    trial_management: 23488
    meetings_travel: 20465
    intervention: 1252
    data_collection: 558
    supplies_equipment: 523
    patient_assessments: 11298
    samples: 1931
    laboratory: 9354
    closeout: 2721

findings:
  - id: casps-f1
    severity: large
    lines: [lab-centrifuge-ctad, lab-centrifuge-cpt]
    summary: "Centrifuge energy overstated ~1000x (watts treated as kilowatts)."
    detail: >-
      Appendix C p.20-21: "310 watts x 0.25 hours = 77.5 kWh" and "310 x 0.583 = 180.73 kWh". 310 W for 0.25 h is
      77.5 Wh = 0.0775 kWh. The same arithmetic appears as the worked example in the guidance (appendix D p.21).
      Corrected, the two centrifuge lines fall from 812.5 kg to 0.81 kg (-811.7 kg, -1.1% of the CASPS total).
  - id: casps-f2
    severity: medium
    lines: [close-tissue-electricity, close-tissue-heating]
    summary: "Ambient tissue storage (1 m2, 10 years) counted twice: section 9.3 (laboratory) and 10.2 (close out)."
    detail: >-
      9.3 includes "Ambient storage of tissue" 221 + 415 kg; 10.2 "Storage and destruction of biological samples"
      repeats 221 + 415 kg for the same 1 m2 x 10 years in a health building. The corrected variant drops the 10.2 copy (-636 kg).
  - id: casps-f3
    severity: info
    lines: [mt-monitoring-au]
    summary: "Australia monitoring distance printed as 11074 p.km in the calculation but the result uses 15310 p.km."
    detail: >-
      Activity column: "Australia total p.km = 15310"; calculation: "11074 p.km x 0.20373 = 3119.1". 15310 x 0.20373 =
      3119.1, 11074 x 0.20373 = 2256.1, so the result is consistent with the activity data; we use 15310.
  - id: casps-f4
    severity: info
    lines: [mt-tmg]
    summary: "TMG teleconference attendees printed as 18 in the calculation, 16 in the activity data; result uses 16."
  - id: casps-f5
    severity: info
    lines: [mt-audit-longhaul]
    summary: "Audit long-haul line: 29442 p.km x 0.21423 = 6307.4, printed 6303.1 (-4.3 kg, <0.1%)."
  - id: casps-f6
    severity: info
    lines: [smp-ctad-cpt]
    summary: "CTAD + CPT glass tubes: calculation shows factor 3.413 but the result (9.57) uses the glass factor 1.403 listed on p.18."

