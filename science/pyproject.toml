[project]
name = "trialpilot-science"
version = "0.1.0"
description = "Science check: reproduce the published carbon footprints of CASPS and PRIMETIME (BMJ Open 2024) with TrialPilot"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "trialpilot-contracts",
    "trialpilot-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialpilot_science"]

[tool.uv.sources]
trialpilot-contracts = { path = "../contracts", editable = true }
trialpilot-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "jsonschema>=4.22",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["req(id, ...): URS requirement id(s) this test verifies (validation/requirements.yaml)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
