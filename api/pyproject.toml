[project]
name = "trialpilot-api"
version = "0.1.0"
description = "TrialPilot FastAPI backend: designs, scenarios, parameter library, exports, SSE"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1",
    "trialpilot-contracts",
    "trialpilot-engine",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialpilot_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["req(id, ...): URS requirement id(s) this test verifies (validation/requirements.yaml)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults


[tool.uv.sources]
trialpilot-contracts = { path = "../contracts", editable = true }
trialpilot-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]
