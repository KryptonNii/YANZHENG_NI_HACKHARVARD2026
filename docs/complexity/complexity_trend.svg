<title id="t">Registered trial complexity versus expectation, 2010 to 2024</title>
<desc id="d">Median observed-to-expected ratios by three-year start block for Regeneron-led trials, large-sponsor peers and all other industry trials. Values are in docs/complexity/complexity_trend.json and the table in docs/COMPLEXITY_TREND.md.</desc>
