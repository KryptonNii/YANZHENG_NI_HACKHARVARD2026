[project]
name = "trialpilot-contracts"
version = "0.1.0"
description = "TrialPilot shared data contracts (pydantic source of truth) and parameter-library loader"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialpilot_contracts"]

[dependency-groups]
dev = ["pytest>=8.2", "jsonschema>=4.22", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# models.py is MASTER §5 verbatim (semicolon one-liners, Optional[], unused Field import).
"trialpilot_contracts/models.py" = ["E702", "F401", "I001", "UP007", "UP045"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# §5 verbatim uses a bare `dict` for OpsEvent.payload.
module = "trialpilot_contracts.models"
disallow_any_generics = false
