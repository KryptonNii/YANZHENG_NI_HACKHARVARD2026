    source_title: "Griffiths, Fox, Williamson et al. BMJ Open 2024;14:e075755, online supplemental appendix C p.18 ('Dry ice: 1.81kg CO2e for 1 kg dry ice produced/used')"
    source_url: "https://bmjopen.bmj.com/content/14/1/e075755"
    source_year: 2024
    rationale: >-
      mid/high = 1.81 from the LCCT guidance (production and use). low = 1.0 = DESNZ 2026 'Refrigerant & other',
      Kyoto products / Carbon dioxide / kg, cell D20 (release of the CO2 only, excludes production).
