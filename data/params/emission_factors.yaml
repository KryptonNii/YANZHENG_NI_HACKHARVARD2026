# Emission factors — UK Government GHG Conversion Factors for Company Reporting (DESNZ).
#
# mid  = 2026 edition (latest; published 11 Jun 2026; "full set (for all users)" — 2026 has no condensed set)
#        https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026
#        workbook ghg-conversion-factors-2026-full-set.xlsx (sha256 b5c4f2f8…0205)
# low/high = min/max of the same cell across the 2022, 2025 and 2026 editions (vintage spread). This is the
#        only range DESNZ lets us source; it does NOT capture vehicle/occupancy variation, so treat it as a floor
#        on uncertainty. 2022 = ghg-conversion-factors-2022-condensed-set.xls (and the 2022 full set for WTT);
#        2025 = ghg-conversion-factors-2025-condensed-set.xlsx.
# Column used: total "kg CO2e" (2025/2026) / "Total kg CO2e per unit" (2022). Cell references below are Excel
# (column letter + 1-based row) in the named sheet. Extraction script + JSON dump: docs/sources.md §DESNZ.
#
# Flights and air freight use the "With RF" (indirect non-CO2 effects) columns everywhere. DESNZ 2025/2026:
# "incorporate a 70% increase in CO2 emissions" ('Business travel- air' A47); 2022: 90% (B47).
#
# Direct factors and well-to-tank (WTT) are separate parameters (`ef.wtt.*`). The Low Carbon Clinical Trials
# method (Griffiths 2024) ADDS WTT to every travel and freight factor — verified to 5 decimals against
# DESNZ 2022 (docs/sources.md §Griffiths). The engine should add `ef.wtt.*` to the direct factor to match it.
defaults:
  source_url: "https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"
  source_year: 2026
  region: "GB"
  version: 1

