    source_title: "DESNZ GHG conversion factors 2026, sheet 'Passenger vehicles', Cars (by size) / Average car / Unknown / km, cell X54"
    rationale: "2026 X54 = 0.16591; 2025 X54 = 0.16725; 2022 Y56 = 0.17067."

