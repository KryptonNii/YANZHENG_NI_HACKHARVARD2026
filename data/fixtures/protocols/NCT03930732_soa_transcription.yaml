# Schedule of Activities of the BOREAS protocol (NCT03930732), transcribed for the offline demo.
#
# WHY THIS FILE EXISTS: the SoA in this protocol (pages 13-15, 18-19) is embedded as page images, so
# text extraction cannot read it and the live path needs a vision LLM. No API key was available while
# building, so the A4 coding agent (Claude Opus 5.5, model id claude-opus-5-5) read the rendered page
# images (150-220 dpi) on 2026-10-16 and transcribed the grid below. It is an LLM transcription like
# the runtime one and goes through the same validator (protocol_extract.candidates_from_transcription);
# it is NOT human-verified. The UI shows every item as a candidate for a human to accept/edit/reject.
#
# The PDF itself is NOT committed: it is a sponsor document ("Property of the Sanofi Group") posted on
# ClinicalTrials.gov, whose terms note third-party copyright. Only facts (which assessment at which
# visit) and short quotes (<= 25 words) are stored here. Source: url below.
nct_id: NCT03930732
document:
  label: Study Protocol
  filename: Prot_000.pdf
  url: https://cdn.clinicaltrials.gov/large-docs/32/NCT03930732/Prot_000.pdf
  protocol_date: "2018-11-07"
  size_bytes: 2507823
  sha256: 76ead4e1be07e49f55ed405820c1a2fec18490505d88f6280e8a811f71f22b23
  page_count: 109
model: "claude-opus-5-5 (build-time transcription by the A4 coding agent from page images; not the runtime EXTRACT_MODEL)"
extracted_at: "2026-10-16T21:40:00Z"
soa_pages: [13, 14, 15, 16, 17, 18, 19, 20]
table: "Section 1.3.1 Schedule of activities for patients who complete the planned treatment (pages 13-15)"
default_confidence: 0.9

