# Schedule items that are not site visits (kept visible, never silently dropped).
excluded_columns:
  - "Unnumbered columns at weeks 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46 and 50 (page 13): IMP administration only - footnote f (page 16) says the IMP is given every 2 weeks at the patient's home or in a health care facility."
  - "EXACT (page 15): 'Every day (diary) from screening to week 52' - daily e-diary at home, not a visit procedure."
  - "At-home spirometry (FEV1), optional, US/Canada only (page 15): twice-daily home measurements, not a visit procedure."

warnings:
  - "Pages 18-19 hold Section 1.3.2, the schedule for patients who stop treatment early; it was not used for the planned visits."
  - "Footnote a (page 16): visit windows are +/-1 week (screening), +/-3 days (treatment period) and +/-5 days (post-treatment)."
  - "Footnote f (page 16): after Week 8, IMP injections not done at home are given at the site as unscheduled visits (not modelled here)."

# Verbatim footnote quotes (<= 25 words) supporting the exclusions above.
footnote_quotes:
  f: {page: 16, quote: "IMP (Dupilumab or placebo) is to be administered every 2 weeks by patient, caregiver or healthcare professional at the patient's home"}
  a: {page: 16, quote: "The visit schedule should be adhered to within ±1 week for the screening period, ±3 days for the randomized IMP treatment period"}
